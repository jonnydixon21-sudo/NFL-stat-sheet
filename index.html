<html lang="en">
<head>

<title>NFL Stat Sheet</title>

<style>
/* VOICE: a bettor's matchday tool - quick, confident, numbers first
   IDEA: the stadium scoreboard and the chalked yard lines of the turf
   PICTURE: striped turf header band; every list reads like a scoreboard row
   COLOUR and TYPE: turf green dominant, chalk white support, penalty-flag yellow accent; Saira Condensed + Barlow
   LAYOUT: phone app - header band, segmented controls, stacked stat cards, fixed bottom tab bar */
:root{color-scheme:light dark;
--bg:light-dark(#eef2ec,#09130d);--card:light-dark(#ffffff,#112118);--ink:light-dark(#0d1a12,#eaf3ec);
--mute:light-dark(#5b6b60,#93a89a);--line:light-dark(#dbe3dc,#1f3427);--turf:#0f6b3a;--turf2:#0b5a30;
--flag:#f5c400;--good:light-dark(#0f7a40,#43d17f);--bad:light-dark(#c2271b,#ff6b5e);--chip:light-dark(#e3eae4,#18291f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3,.num,.tab,.seg button{font-family:"Saira Condensed",Barlow,sans-serif}
header{background:repeating-linear-gradient(90deg,var(--turf) 0 46px,var(--turf2) 46px 92px);color:#fff;position:relative;
 padding:calc(18px + env(safe-area-inset-top)) max(4vw,16px) 18px}
header::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 45px,rgba(255,255,255,.35) 45px 47px);pointer-events:none;mask:linear-gradient(#000 0 20%,transparent 20% 80%,#000 80%)}
header h1{margin:0;font-size:clamp(32px,8vw,46px);line-height:1;font-weight:800;letter-spacing:.5px}
header h1 b{color:var(--flag)}
header p{margin:6px 0 0;font-size:14px;opacity:.9;position:relative;z-index:1}
main{max-width:1100px;margin:0 auto;padding:14px max(3vw,12px)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.seg button{flex:0 0 auto;border:0;background:var(--chip);color:var(--ink);font-size:17px;font-weight:700;padding:0 16px;height:40px;border-radius:20px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--turf);color:#fff}
.seg.small button{font-size:15px;height:36px;padding:0 13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:20px;line-height:1.1;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 small{font-family:Barlow,system-ui,sans-serif;font-size:13px;color:var(--mute);font-weight:500}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.duo h4{margin:0 0 4px;font-size:13px;font-weight:600}
.duo .b h4{color:var(--good)}.duo .w h4{color:var(--bad)}
ol{list-style:none;margin:0;padding:0}
li.r{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:6px;align-items:baseline;padding:4px 0;border-top:1px solid var(--line);font-size:15px}
li.r:first-child{border-top:0}
li.r .k{color:var(--mute);font-size:13px}
li.r .num{font-size:18px;font-weight:700;white-space:nowrap}
li.r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li.r .nm i{font-style:normal;color:var(--mute);font-size:13px;margin-left:4px}
.more{margin-top:6px;border:0;background:none;color:var(--good);font:600 14px Barlow,system-ui,sans-serif;padding:8px 0;cursor:pointer;min-height:36px}
.note{font-size:13px;color:var(--mute);margin:10px 2px}
.search{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px Barlow,system-ui,sans-serif;padding:0 12px;margin-bottom:10px}
select,input.ln{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px Barlow,system-ui,sans-serif;padding:0 10px}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .who{font-weight:600}.mrow .who i{font-style:normal;color:var(--mute);font-weight:500;font-size:13px}
.mrow .proj{text-align:right}.mrow .proj .num{font-size:24px;font-weight:800;line-height:1}
.mrow .proj small{display:block;font-size:12px;color:var(--mute)}
.mrow .sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--mute)}
.tag{display:inline-block;font:700 12px Barlow,system-ui,sans-serif;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--ink)}
.tag.g5{background:#0f7a40;color:#fff}.tag.g4{background:#7ccf9a;color:#0d1a12}.tag.g2{background:#f3a59d;color:#3a0b06}.tag.g1{background:#c2271b;color:#fff}
.tag.ov{background:var(--flag);color:#1a1400}.tag.un{background:#2b4cc2;color:#fff}
.mrow input.ln{width:92px;height:36px;font-size:16px}
.big{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.big div{background:var(--chip);border-radius:12px;padding:10px}
.big .num{font-size:30px;font-weight:800;line-height:1;display:block}
.big small{font-size:13px;color:var(--mute)}
.pick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:6px}
.pick label{font-size:13px;color:var(--mute);display:grid;gap:4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tab{border:0;background:none;color:var(--mute);font-size:15px;font-weight:700;height:64px;display:grid;place-items:center;gap:0;cursor:pointer;padding:6px 0}
.tab svg{width:24px;height:24px}
.tab[aria-selected=true]{color:var(--turf)}
:root[data-theme=dark] .tab[aria-selected=true]{color:#43d17f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tab[aria-selected=true]{color:#43d17f}}
.view{display:none}.view.on{display:block;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}}
.pickrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}.pickrow:first-child{border-top:0}
.pickrow .rk{font:800 26px "Saira Condensed",Barlow,sans-serif;color:var(--mute);text-align:center}.pickrow .who{font-weight:600;font-size:17px}
.pct{font:800 34px/1 "Saira Condensed",Barlow,sans-serif;text-align:right;color:var(--good)}.pct small{display:block;font:500 12px Barlow,system-ui,sans-serif;color:var(--mute);margin-top:2px}
.gbet{padding:12px 0;border-top:1px solid var(--line)}.gbet:first-child{border-top:0}
.gtitle i{font-style:normal;color:var(--mute);font-size:13px}
.gsides{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:8px 0 6px}
.gside{background:var(--chip);border-radius:12px;padding:8px 10px;display:grid;gap:0}
.gside span{font-weight:600;font-size:15px}.gside b{font:800 30px/1.05 "Saira Condensed",Barlow,sans-serif;color:var(--mute)}
.gside small{font-size:12px;color:var(--mute)}
.gside.best{background:var(--turf);color:#fff}.gside.best b{color:#fff}.gside.best small{color:rgba(255,255,255,.85)}
.l5row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.l5row:first-of-type{border-top:0}.l5row .num{font-size:20px;font-weight:800;white-space:nowrap}.l5row .num small{font:600 12px Barlow,system-ui,sans-serif;color:var(--mute)}
.res{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;font:800 16px "Saira Condensed",Barlow,sans-serif;color:#fff;background:var(--mute)}
.res.W{background:#0f7a40}.res.L{background:#c2271b}
.tpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.tpick button{border:0;border-radius:10px;background:var(--chip);color:var(--ink);padding:8px 4px;min-height:52px;cursor:pointer;display:grid;gap:0;text-align:center}
.tpick button b{font:800 18px "Saira Condensed",Barlow,sans-serif}.tpick button small{font-size:11px;color:var(--mute)}
.tpick button[aria-pressed=true]{background:var(--turf);color:#fff}.tpick button[aria-pressed=true] small{color:rgba(255,255,255,.85)}
.games{padding:4px 14px}.games summary{cursor:pointer;font-weight:600;padding:10px 0;min-height:44px;display:flex;align-items:center}.game{padding:8px 0;border-top:1px solid var(--line);cursor:pointer}.game:first-child{border-top:0}
.game i{font-style:normal;color:var(--mute);font-size:13px}.gsub{font-size:13px;color:var(--mute)}
.warn{color:var(--bad);font-weight:600}.form{font-size:13px}.form b{display:inline-block;min-width:30px;text-align:center;background:var(--chip);border-radius:6px;padding:0 5px;margin-right:2px;color:var(--ink);font-weight:600}
.up{color:var(--good);font-weight:700;font-size:13px}.dn{color:var(--bad);font-weight:700;font-size:13px}
.pos{color:var(--good)}.neg{color:var(--bad)}
table.lg{width:100%;border-collapse:collapse;font-size:14px}table.lg td{padding:6px 4px;border-top:1px solid var(--line)}table.lg td:first-child{color:var(--mute);white-space:nowrap;width:48px}
.scm{padding:12px 0;border-top:1px solid var(--line)}.scm:first-child{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips span{background:var(--chip);border-radius:8px;padding:3px 8px;font-size:13px}.chips b{font-weight:700}
.splits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:6px 0}.splits div{background:var(--chip);border-radius:10px;padding:6px 8px;text-align:center}
.splits b{display:block;font:800 22px/1.1 "Saira Condensed",Barlow,sans-serif}.splits small{font-size:11px;color:var(--mute)}.splits .hi{outline:2px solid var(--turf)}
.verdict{font-weight:700;font-size:14px;border-radius:8px;padding:2px 8px;display:inline-block}.verdict.up{background:rgba(15,122,64,.14)}.verdict.dn{background:rgba(194,39,27,.12)}.verdict.mid{background:var(--chip);color:var(--mute)}
.rlist{font-size:14px;margin:4px 0 0}.rlist div{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
@media (max-width:380px){.duo{gap:8px}li.r{font-size:14px}li.r .num{font-size:16px}}
</style>
</head>

  return [fit ? fit.adj : 0, `<div class="scm"><div class="gtitle"><b>${off} passing vs ${def} defence</b> ${fit ? verdict(fit.adj, sur(q.n)) : ''}</div>${defChips(def)}${qbH}${recH}</div>`];
}
function schemeView(games) {
  const gs = D.games.filter(g => gsel === 'all' || gsel === g.a + g.h);
  const cards = gs.map(g => { const a = schemeBlock(g.a, g.h), h = schemeBlock(g.h, g.a); return [Math.max(Math.abs(a[0]), Math.abs(h[0])), `<div class="card" style="margin-top:12px"><div class="gtitle" style="margin-bottom:4px"><b>${g.a} @ ${g.h}</b> <i>${g.k}${g.note ? ' · ' + g.note : ''}</i></div>${a[1]}${h[1]}</div>`]; })
    .sort((x, y) => y[0] - x[0]).map(x => x[1]).join('');
  $('#match-out').innerHTML = `<div class="seg small" id="cats"></div><div class="seg small" id="gms"></div>${cards}
    <p class="note">How each passing game lines up with the defence it faces. Blitz = defence sends 5+ rushers. Man and zone are the share of coverage snaps (league average ${f1(LG.man)}% man, ${f1(LG.zone)}% zone, ${f1(LG.blitz)}% blitz); two-high means two deep safeties, which takes away deep shots. The green-outlined box is the look the QB will see most. The +/- number is roughly how many passer-rating points above or below his normal the scheme should push him, from his rating against man, zone and the blitz. Receivers show yards per route run against man and zone, and what to expect against this defence's mix (▲ better than his normal, ▼ worse). Splits use small samples, so treat big gaps with care. Coverage rates from Sharp Football (${S.asOf.cov}), blitz rates and EPA from FTN charting via muffed.ai (to ${S.asOf.blitz}), QB and receiver splits from Dynasty Nerds (to ${S.asOf.qb}). Games with the biggest scheme edge come first.</p>`;
  seg($('#cats'), CATS, cat, k => { cat = k; weekView(); }, 1);
  seg($('#gms'), games, gsel, k => { gsel = k; weekView(); }, 1);
}
function schemeTag(p, def) { const q = S.qb[nk(p.n)]; if (!q || !SD[def]) return ''; const a = qbFit(q, def).adj; return a >= 2 ? ` · <span class="up">scheme suits him</span>` : a <= -2 ? ` · <span class="dn">tough scheme</span>` : ''; }
/* ---------- game picks: spread, over/under, moneyline ---------- */
const Phi = z => { const t = 1 / (1 + .2316419 * Math.abs(z)), d = .3989423 * Math.exp(-z * z / 2), p = d * t * (.3193815 + t * (-.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; };
function gameModel(g) {
  const A = T[g.a], H = T[g.h], lg = AL.pts;
  const pa = (A.pf / A.gp) * (H.pa / H.gp) / lg - .75, ph = (H.pf / H.gp) * (A.pa / A.gp) / lg + .75; // ~1.5 pts home edge
  const o = g.odds, mLine = o.fav === g.h ? o.sp : -o.sp;              // bookies' expected home margin
  const margin = ((ph - pa) + mLine) / 2, total = ((ph + pa) + o.tot) / 2; // pulled halfway to the line
  return { pa, ph, margin, total, mLine };
}
function gamePicks(kind) {
  return D.games.filter(g => g.odds).map(g => {
    const m = gameModel(g), o = g.odds, score = `Stats say ${g.a} ${Math.round(m.pa)} - ${Math.round(m.ph)} ${g.h}`;
    if (kind === 'spread') {
      const pH = Phi((m.margin - m.mLine) / 13.5), home = pH >= .5, team = home ? g.h : g.a, line = (team === o.fav ? '-' : '+') + o.sp;
      return { g, p: home ? pH : 1 - pH, bet: `${team} ${line}`, sub: score };
    }
    if (kind === 'total') {
      const pO = Phi((m.total - o.tot) / 10), over = pO >= .5;
      return { g, p: over ? pO : 1 - pO, bet: `${over ? 'Over' : 'Under'} ${o.tot}`, sub: `${score} (${Math.round(m.ph + m.pa)} total)` };
    }
    const pH = Phi(m.margin / 13.5), mk = o.ml, eH = pH - mk[g.h], eA = (1 - pH) - mk[g.a], home = eH >= eA, team = home ? g.h : g.a;
    return { g, p: home ? pH : 1 - pH, edge: home ? eH : eA, book: mk[team], bet: `${team} to win`, sub: `Bookies ${Math.round(mk[team] * 100)}% · fair odds ${f1(1 / (home ? pH : 1 - pH))}` };
  }).filter(x => kind !== 'ml' || x.edge > 0).sort((a, b) => kind === 'ml' ? b.edge - a.edge : b.p - a.p).slice(0, 5);
}
let topK = 'td';
function topView() {
  let rows, help;
  if (topK === 'td') {
    rows = P.filter(p => opp[p.t] && p.gp >= 3 && roles.td(p) && !(p.inj && p.inj[0] === 'O'))
      .map(p => [p, proj(p, opp[p.t].o, true).tdP]).sort((a, b) => b[1] - a[1]).slice(0, 5)
      .map(([p, pr], i) => { const g = opp[p.t].g; return `<div class="pickrow" data-p="${p.n}"><span class="rk">${i + 1}</span><div><div class="who">${p.n}</div>
        <div class="gsub">Anytime TD · ${p.t} ${opp[p.t].home ? 'vs' : '@'} ${opp[p.t].o} · ${g.k}</div>${p.inj ? `<div style="margin-top:4px">${injTag(p)}</div>` : ''}</div>
        <div class="pct">${Math.round(pr * 100)}%<small>fair ${f1(1 / pr)}</small></div></div>`; });
    help = 'The five players most likely to score a touchdown in the upcoming games. Players ruled out are left off. Tap a name for his full matchup.';
  } else {
    rows = gamePicks(topK).map((x, i) => `<div class="pickrow"><span class="rk">${i + 1}</span><div><div class="who">${x.bet}</div>
      <div class="gsub">${x.g.a} @ ${x.g.h} · ${x.g.k}${x.g.note ? ' · ' + x.g.note : ''}</div><div class="gsub">${x.sub}</div></div>
      <div class="pct">${Math.round(x.p * 100)}%<small>${topK === 'ml' ? 'chance to win' : topK === 'spread' ? 'chance to cover' : 'chance it lands'}</small></div></div>`);
    help = { spread: 'The five sides most likely to cover the spread.', total: 'The five over/unders most likely to land.',
      ml: 'Teams the stats rate more likely to win than the bookies do, biggest gap first. The big number is the app\'s win chance; compare its fair odds with your bookie\'s price before betting.' }[topK] +
      ' Each team\'s expected score comes from points scored and allowed this season, with a small home edge, then pulled halfway to the bookies\' line because betting lines are hard to beat. Lines are early-week prices, so check they haven\'t moved.';
  }
  $('#match-out').innerHTML = `<div class="seg small" id="topk"></div><div class="card">${rows.join('') || '<p class="note">No picks right now.</p>'}</div><p class="note">${help} A guide, not a guarantee.</p>`;
  seg($('#topk'), [['td', 'Anytime TD'], ['spread', 'Spread'], ['total', 'Over/under'], ['ml', 'Moneyline']], topK, k => { topK = k; topView(); }, 1);
}
$('#match-out').addEventListener('click', e => { const r = e.target.closest('.pickrow[data-p]'); if (r && mk === 'top') { fP = r.dataset.p; fO = null; mk = 'finder'; seg($('#seg-match'), MSEG, 'finder', matchView); finder(); } });
const MSEG = [['top', 'Top 5 picks'], ['week', `Week ${D.week}`], ['finder', 'Any player vs any team']];
function matchView(k) { mk = k; k === 'top' ? topView() : k === 'week' ? weekView() : finder(); }
seg($('#seg-match'), MSEG, 'top', matchView);
matchView('top');

const h = location.hash.slice(1); if (['teams', 'players', 'match'].includes(h)) go(h);
}
</script>
<script>
if (location.hostname.endsWith("github.io")) {
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  /* Home-screen apps can keep showing an old copy. Each time the app opens or comes back to the front,
     check GitHub for a newer build and reload if there is one. */
  const mine = (document.getElementById("build") || {}).content;
  let checking = false;
  const check = async () => {
    if (checking || !mine) return; checking = true;
    try {
      const r = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
      const m = (await r.text()).match(/<meta id="build" content="(\d+)"/);
      if (m && m[1] !== mine) location.replace(location.pathname + "?v=" + m[1] + location.hash);
    } catch (e) {}
    checking = false;
  };
  addEventListener("load", check);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
}
</script>
